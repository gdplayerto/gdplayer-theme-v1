name: CI

on:
  push:
    branches: [dev4.8.6-p5, main]
  pull_request:
    branches: [dev4.8.6-p5, main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, mbstring, zip, gd, intl, xml
          tools: composer:v2
          coverage: none

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Syntax check (php -l)
        run: find . -name '*.php' -not -path './vendor/*' -not -path './.github/*' -print0 | xargs -0 -n1 php -l

      - name: PHPStan
        if: always()
        run: test -x vendor/bin/phpstan && vendor/bin/phpstan analyse --no-progress || echo "phpstan not available, skipping"

      - name: PHP-CS-Fixer
        if: always()
        run: test -x vendor/bin/php-cs-fixer && vendor/bin/php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.dist.php || echo "php-cs-fixer not available, skipping"

      - name: PHPCS
        if: always()
        run: test -x vendor/bin/phpcs && vendor/bin/phpcs || echo "phpcs not available, skipping"
